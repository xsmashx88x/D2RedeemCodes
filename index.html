<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DESTINY 2 // GUARDIAN KIOSK TERMINAL</title>
  
  <!-- Destiny 2 Font Inspirations -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #080a0f;
      --panel-bg: rgba(14, 18, 26, 0.88);
      --panel-border: rgba(255, 255, 255, 0.12);
      --panel-hover: rgba(26, 34, 48, 0.95);
      --d2-amber: #e5a93c;
      --d2-amber-glow: rgba(229, 169, 60, 0.35);
      --d2-cyan: #00f0ff;
      --d2-blue: #4a9eff;
      --d2-exotic: #ceae33;
      --d2-legendary: #9c67d6;
      --d2-claimed: #10b981;
      --text-main: #f0f2f5;
      --text-muted: #8a96a8;
      --font-display: 'Rajdhani', sans-serif;
      --font-mono: 'Share Tech Mono', monospace;
      --font-ui: 'Chakra Petch', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(229, 169, 60, 0.08), transparent 60%),
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 40px 40px, 40px 40px;
      color: var(--text-main);
      font-family: var(--font-display);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Scanline overlay */
    body::before {
      content: " ";
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      z-index: 999;
      pointer-events: none;
      opacity: 0.0;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px 20px 80px 20px;
    }

    /* HEADER */
    header {
      border-bottom: 1px solid var(--panel-border);
      padding-bottom: 24px;
      margin-bottom: 24px;
      position: relative;
    }

    .header-top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .tricorn-icon {
      width: 48px;
      height: 48px;
      fill: var(--d2-amber);
      filter: drop-shadow(0 0 12px var(--d2-amber-glow));
    }

    .title-group h1 {
      font-size: 2.1rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      line-height: 1.1;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .title-group h1 span {
      color: var(--d2-amber);
    }

    .title-group p {
      font-family: var(--font-mono);
      font-size: 0.82rem;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* ACTION BUTTONS & KO-FI */
    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .kofi-btn {
      background: linear-gradient(135deg, #ff5e5b, #e0322f);
      color: #fff;
      font-family: var(--font-ui);
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 10px 18px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(255, 94, 91, 0.3);
      text-decoration: none;
    }

    .kofi-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 94, 91, 0.5);
      filter: brightness(1.1);
    }

    .kofi-btn svg {
      width: 18px;
      height: 18px;
      fill: #fff;
    }

    /* PROGRESS TRACKER BAR */
    .progress-section {
      margin-top: 20px;
      background: rgba(18, 22, 32, 0.6);
      border: 1px solid var(--panel-border);
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .progress-bar-container {
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      width: 100%;
      overflow: hidden;
      position: relative;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--d2-amber), var(--d2-cyan));
      width: 0%;
      transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 0 10px var(--d2-cyan);
    }

    /* CONTROLS: CATEGORIES & SEARCH */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 26px;
    }

    .category-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tab-btn {
      background: rgba(18, 24, 34, 0.7);
      border: 1px solid var(--panel-border);
      color: var(--text-muted);
      font-family: var(--font-ui);
      font-size: 0.88rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 9px 18px;
      cursor: pointer;
      position: relative;
      transition: all 0.2s ease;
      clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
    }

    .tab-btn:hover {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.4);
      background: rgba(30, 40, 58, 0.8);
    }

    .tab-btn.active {
      color: #fff;
      border-color: var(--d2-amber);
      background: rgba(229, 169, 60, 0.15);
      box-shadow: inset 0 0 12px rgba(229, 169, 60, 0.2);
    }

    .tab-btn.active::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 15%;
      width: 70%;
      height: 2px;
      background: var(--d2-amber);
      box-shadow: 0 0 8px var(--d2-amber);
    }

    .search-filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
      justify-content: space-between;
    }

    .search-box {
      flex: 1;
      min-width: 260px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      background: rgba(15, 20, 29, 0.8);
      border: 1px solid var(--panel-border);
      padding: 10px 16px 10px 38px;
      color: #fff;
      font-family: var(--font-display);
      font-size: 1rem;
      letter-spacing: 1px;
      outline: none;
      transition: border 0.2s ease;
    }

    .search-box input:focus {
      border-color: var(--d2-amber);
      box-shadow: 0 0 10px rgba(229, 169, 60, 0.2);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      fill: var(--text-muted);
      pointer-events: none;
    }

    .filter-toggles {
      display: flex;
      align-items: center;
      gap: 16px;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      letter-spacing: 1px;
      color: var(--text-muted);
    }

    .custom-checkbox {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }

    .custom-checkbox input[type="checkbox"] {
      appearance: none;
      width: 16px;
      height: 16px;
      border: 1px solid var(--panel-border);
      background: rgba(255, 255, 255, 0.05);
      cursor: pointer;
      position: relative;
      transition: all 0.2s;
    }

    .custom-checkbox input[type="checkbox"]:checked {
      background: var(--d2-amber);
      border-color: var(--d2-amber);
    }

    .custom-checkbox input[type="checkbox"]:checked::after {
      content: "✕";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #000;
      font-size: 11px;
      font-weight: bold;
    }

    /* ITEM GRID */
    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 16px;
    }

    /* CARD STYLING */
    .item-card {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      position: relative;
      clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%);
    }

    .item-card:hover {
      border-color: rgba(255, 255, 255, 0.35);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      transform: translateY(-2px);
    }

    .item-card.claimed {
      opacity: 0.58;
      border-color: rgba(16, 185, 129, 0.3);
      background: rgba(12, 20, 22, 0.85);
    }

    .item-card.claimed:hover {
      opacity: 0.9;
    }

    .card-corner-tag {
      position: absolute;
      top: 0;
      right: 0;
      width: 12px;
      height: 12px;
      background: var(--panel-border);
      clip-path: polygon(100% 0, 0 0, 100% 100%);
    }

    .item-card.claimed .card-corner-tag {
      background: var(--d2-claimed);
    }

    .card-header {
      padding: 12px 14px 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .category-badge {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 3px 8px;
      background: rgba(255, 255, 255, 0.05);
      border-left: 2px solid var(--d2-cyan);
      color: var(--d2-cyan);
    }

    .category-badge.Ornaments { border-color: var(--d2-amber); color: var(--d2-amber); }
    .category-badge.Shaders { border-color: #a855f7; color: #d8b4fe; }
    .category-badge.Emotes { border-color: #ec4899; color: #f472b6; }
    .category-badge.Ships { border-color: #3b82f6; color: #93c5fd; }
    .category-badge.Sparrows { border-color: #10b981; color: #6ee7b7; }
    .category-badge.Ghost-Shells { border-color: #eab308; color: #fde047; }

    .claim-action {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-muted);
      cursor: pointer;
    }

    .card-body {
      padding: 14px;
      display: flex;
      gap: 14px;
      align-items: center;
      flex: 1;
    }

/* PREVIEW THUMBNAIL */
    .preview-container {
      width: 72px;
      height: 72px;
      background: #0d1219;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
      cursor: pointer;
      overflow: hidden;
      clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 0 100%);
    }

    .preview-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: left center; /* <-- Anchors to the very left side */
      display: block;
      transition: transform 0.3s ease;
      transform-origin: left center; /* Keeps zoom pinned to the left edge */
    }

    .preview-container:hover img {
      transform: scale(1.1);
    }

    .preview-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.3);
      font-family: var(--font-mono);
      font-size: 0.65rem;
      text-align: center;
      padding: 4px;
      width: 100%;
      height: 100%;
    }

    .preview-placeholder svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
      margin-bottom: 2px;
      opacity: 0.7;
    }

    .item-info {
      flex: 1;
      min-width: 0;
    }

    .item-title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #fff;
      line-height: 1.2;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-note {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      line-height: 1.3;
    }

    .card-footer {
      background: rgba(10, 14, 22, 0.95);
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .code-link {
      font-family: var(--font-mono);
      font-size: 1.05rem;
      color: var(--d2-amber);
      text-decoration: none;
      letter-spacing: 1.5px;
      font-weight: 600;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .code-link:hover {
      color: #fff;
      text-shadow: 0 0 8px var(--d2-amber-glow);
    }

    .code-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .action-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--panel-border);
      color: var(--text-main);
      font-family: var(--font-ui);
      font-size: 0.72rem;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      padding: 6px 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.4);
      color: #fff;
    }

    .action-btn.copy-btn:active {
      background: var(--d2-cyan);
      color: #000;
    }

    .action-btn svg {
      width: 13px;
      height: 13px;
      fill: currentColor;
    }

    /* TOAST NOTIFICATION */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #0f1521;
      border-left: 4px solid var(--d2-amber);
      border-top: 1px solid var(--panel-border);
      border-right: 1px solid var(--panel-border);
      border-bottom: 1px solid var(--panel-border);
      padding: 14px 20px;
      color: #fff;
      font-family: var(--font-mono);
      font-size: 0.88rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.8);
      transform: translateY(100px);
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1000;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    /* LIGHTBOX PREVIEW MODAL */
    .lightbox-modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: 20px;
    }

    .lightbox-modal.active {
      display: flex;
    }

    .lightbox-content {
      background: var(--panel-bg);
      border: 1px solid var(--d2-amber);
      max-width: 600px;
      width: 100%;
      padding: 20px;
      position: relative;
      box-shadow: 0 0 30px var(--d2-amber-glow);
    }

    .lightbox-img {
      width: 100%;
      max-height: 400px;
      object-fit: contain;
      border: 1px solid var(--panel-border);
      background: #000;
      display: block;
    }

    .lightbox-caption {
      margin-top: 12px;
      font-family: var(--font-display);
      font-size: 1.2rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .close-lightbox {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
      line-height: 1;
    }

    .close-lightbox:hover {
      color: #fff;
    }

    /* FOOTER */
    footer {
      margin-top: 60px;
      border-top: 1px solid var(--panel-border);
      padding-top: 24px;
      text-align: center;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      text-transform: uppercase;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    @media (max-width: 768px) {
      .items-grid {
        grid-template-columns: 1fr;
      }
      .title-group h1 {
        font-size: 1.6rem;
      }
      .header-top {
        flex-direction: column;
        align-items: flex-start;
      }
      .header-actions {
        width: 100%;
        justify-content: space-between;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- HEADER -->
    <header>
      <div class="header-top">
        <div class="logo-area">
          <svg class="tricorn-icon" viewBox="0 0 100 100">
            <path d="M50 5 L68 38 L95 44 L72 65 L78 95 L50 78 L22 95 L28 65 L5 44 L32 38 Z" fill="none" stroke="currentColor" stroke-width="4"/>
            <circle cx="50" cy="50" r="14" fill="currentColor"/>
          </svg>
          <div class="title-group">
            <h1>DESTINY 2 <span>// REDEEM ARCHIVE</span></h1>
            <p>TACTICAL KIOSK // DIRECT PROTOCOL CODES</p>
          </div>
        </div>

        <div class="header-actions">
          <button class="kofi-btn" onclick="openKofiWindow()">
            <svg viewBox="0 0 24 24">
              <path d="M23.881 8.948c-.773-4.085-4.859-4.593-4.859-4.593H.723c-.604 0-.679.798-.679.798s-.082 7.324-.022 11.822c.164 2.424 2.586 2.672 2.586 2.672s8.267-.023 11.966-.049c2.438-.426 2.683-2.566 2.658-3.734 4.352.24 7.422-2.831 6.649-6.916zm-11.022 5.64s-4.305 3.753-4.507 3.753c-.201 0-4.507-3.753-4.507-3.753-1.637-1.428-1.74-3.693-.231-5.202 1.509-1.509 3.957-1.509 5.466 0l.272.272.272-.272c1.509-1.509 3.957-1.509 5.466 0 1.509 1.509 1.406 3.774-.231 5.202zm7.135-2.285c-.456.913-1.282 1.488-2.378 1.624.116-1.542.068-3.153.068-4.707 1.096.082 1.922.657 2.378 1.57.456.913.456 1.6 0 1.513z"/>
            </svg>
            TRIBUTE // KO-FI
          </button>
        </div>
      </div>

      <!-- PROGRESS TRACKER -->
      <div class="progress-section">
        <div class="progress-meta">
          <span>PROGRESSION: <span id="progress-text">0 / 0</span> CLAIMED</span>
          <span id="progress-percent" style="color: var(--d2-amber);">0%</span>
        </div>
        <div class="progress-bar-container">
          <div class="progress-bar-fill" id="progress-fill"></div>
        </div>
      </div>
    </header>

    <!-- CONTROLS & FILTER BAR -->
    <section class="controls">
      <div class="category-tabs" id="category-tabs">
        <button class="tab-btn active" data-category="ALL">ALL [60]</button>
        <button class="tab-btn" data-category="Emblems">EMBLEMS</button>
        <button class="tab-btn" data-category="Shaders">SHADERS</button>
        <button class="tab-btn" data-category="Emotes">EMOTES</button>
        <button class="tab-btn" data-category="Transmats">TRANSMATS</button>
        <button class="tab-btn" data-category="Ornaments">ORNAMENTS</button>
        <button class="tab-btn" data-category="Ships">SHIPS</button>
        <button class="tab-btn" data-category="Sparrows">SPARROWS</button>
        <button class="tab-btn" data-category="Ghost Shells">GHOST SHELLS</button>
      </div>

      <div class="search-filter-row">
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24">
            <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>
          <input type="text" id="search-input" placeholder="SEARCH DATABASE BY NAME OR CODE..." />
        </div>

        <div class="filter-toggles">
          <label class="custom-checkbox">
            <input type="checkbox" id="hide-claimed-toggle" />
            <span>HIDE REDEEMED</span>
          </label>
        </div>
      </div>
    </section>

    <!-- ITEM GRID -->
    <main class="items-grid" id="items-grid"></main>

    <!-- FOOTER -->

    // Auto-normalizes URLs for Bungie & GitHub
    function normalizeImageUrl(url) {
      if (!url) return "";
      url = url.trim();

      // Convert relative Bungie path to full URL
      if (url.startsWith("/common/") || url.startsWith("common/")) {
        return "https://www.bungie.net/" + url.replace(/^\/+/, "");
      }
      
      // Ensure bungie.net uses www.bungie.net CDN
      if (url.startsWith("https://bungie.net/")) {
        return url.replace("https://bungie.net/", "https://www.bungie.net/");
      }

      // Convert GitHub blob links to raw file CDN
      if (url.includes("github.com") && url.includes("/blob/")) {
        return url.replace("github.com", "raw.githubusercontent.com").replace("/blob/", "/");
      }

      return url;
    }

    function openKofiWindow() {
      const width = 480;
      const height = 720;
      const left = Math.max(0, (window.innerWidth - width) / 2 + window.screenX);
      const top = Math.max(0, (window.innerHeight - height) / 2 + window.screenY);
      window.open(
        "https://ko-fi.com/xsmashx88x/tip",
        "kofiWindow",
        `width=${width},height=${height},top=${top},left=${left},resizable=yes,scrollbars=yes,status=no,toolbar=no,menubar=no`
      );
    }

    function setupTabs() {
      const tabs = document.querySelectorAll(".tab-btn");

          currentCategory = tab.dataset.category;
          renderCards();
        });
      });
    }

    function setupSearchAndFilters() {

      });

      const hideToggle = document.getElementById("hide-claimed-toggle");
      hideToggle.addEventListener("change", (e) => {
        hideClaimed = e.target.checked;
        renderCards();
      });
    }

    function escapeHtml(str) {
      if (!str) return "";
      return str.replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
    }

        const matchesSearch = item.name.toLowerCase().includes(searchQuery) || item.code.toLowerCase().includes(searchQuery);
        const isClaimed = redeemedCodes.has(item.code);
        const matchesClaimed = hideClaimed ? !isClaimed : true;
        return matchesCategory && matchesSearch && matchesClaimed;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; padding: 60px 20px; font-family: var(--font-mono); color: var(--text-muted);">
            NO CODES FOUND MATCHING ACTIVE PROTOCOLS.
          </div>
        `;
        return;
      }

      filtered.forEach(item => {
        const isClaimed = redeemedCodes.has(item.code);
        const card = document.createElement("div");
        card.className = `item-card ${isClaimed ? "claimed" : ""}`;
        card.dataset.code = item.code;

        const badgeClass = item.category.replace(/\s+/g, '-');
        const bungieRedeemUrl = `https://bungie.net/7/en/codes/redeem?token=${encodeURIComponent(item.code)}`;

        card.innerHTML = `
          <div class="card-corner-tag"></div>
          <div class="card-header">
            <span class="category-badge ${badgeClass}">// ${item.category}</span>
            <label class="claim-action custom-checkbox">
              <input type="checkbox" ${isClaimed ? "checked" : ""} class="claim-checkbox" />
              <span>${isClaimed ? "CLAIMED" : "UNCLAIMED"}</span>
            </label>
          </div>
          <div class="card-body">
            <div class="preview-container" title="Click to Inspect"></div>
            <div class="item-info">
              <h3 class="item-title" title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</h3>
              <p class="item-note">${escapeHtml(item.note || "Bungie.net redeemable code")}</p>
            </div>
          </div>
          <div class="card-footer">
            <a href="${bungieRedeemUrl}" target="_blank" rel="noopener noreferrer" class="code-link" title="Click to Redeem on Bungie.net">
              ${item.code}
              <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                <path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/>
              </svg>
            </a>
            <div class="code-actions">
              <button class="action-btn copy-btn" title="Copy code to clipboard">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                COPY
              </button>
            </div>
          </div>
        `;

        // Checkbox event
        const checkbox = card.querySelector(".claim-checkbox");
        checkbox.addEventListener("change", () => toggleClaim(item.code));

        // Copy button event
        const copyBtn = card.querySelector(".copy-btn");
        copyBtn.addEventListener("click", () => copyCode(item.code));

        // Preview Container: Construct image cleanly in DOM
        const previewContainer = card.querySelector(".preview-container");
        if (item.image && item.image.trim() !== "") {
          const finalUrl = normalizeImageUrl(item.image);
          const img = document.createElement("img");
          img.src = finalUrl;
          img.alt = item.name;
          img.loading = "lazy";
          img.referrerPolicy = "no-referrer"; // Crucial for Bungie CDN compatibility

          img.addEventListener("click", () => {
            openLightbox(finalUrl, item.name, item.code);
          });

          img.addEventListener("error", () => {
            previewContainer.innerHTML = getSvgPlaceholder(item.category);
          });

          previewContainer.appendChild(img);
        } else {
          previewContainer.innerHTML = getSvgPlaceholder(item.category);
        }

        grid.appendChild(card);
      });
    }

    function getSvgPlaceholder(category) {
      const svg = SVG_ICONS[category] || SVG_ICONS.Emblems;
      return `<div class="preview-placeholder">${svg}<span>${category.toUpperCase()}</span></div>`;
    }

    function toggleClaim(code) {
      if (redeemedCodes.has(code)) {
        redeemedCodes.delete(code);
        showToast(`UNMARKED // ${code}`);
      } else {
        redeemedCodes.add(code);
        showToast(`CLAIMED // ${code}`);
      }

      localStorage.setItem(STORAGE_KEY, JSON.stringify([...redeemedCodes]));
      renderCards();
      updateProgress();
    }

    function updateProgress() {
      const total = ITEMS.length;
      const claimed = redeemedCodes.size;
      const percent = total > 0 ? Math.round((claimed / total) * 100) : 0;

      document.getElementById("progress-text").textContent = `${claimed} / ${total}`;
      document.getElementById("progress-percent").textContent = `${percent}%`;
      document.getElementById("progress-fill").style.width = `${percent}%`;
    }

    function copyCode(code) {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(code).then(() => {
          showToast(`COPIED // ${code}`);
        });
      } else {
        const textArea = document.createElement("textarea");
        textArea.value = code;
        textArea.style.position = "fixed";
        textArea.style.opacity = "0";
        document.body.appendChild(textArea);
        textArea.select();
        try {
          document.execCommand('copy');
          showToast(`COPIED // ${code}`);
        } catch (err) {
          showToast(`ERROR COPYING CODE`);
        }
        document.body.removeChild(textArea);
      }
    }

    let toastTimeout;
    function showToast(msg) {
      const toast = document.getElementById("toast");
      const text = document.getElementById("toast-message");
      text.textContent = msg;

      toast.classList.add("show");
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove("show");
      }, 2600);
    }

    function openLightbox(imgSrc, title, code) {
      if (!imgSrc) return;
      document.getElementById("lightbox-img").src = imgSrc;
      document.getElementById("lightbox-title").textContent = title;
      document.getElementById("lightbox-code").textContent = code;
      document.getElementById("lightbox").classList.add("active");
    }

    function closeLightbox() {
      document.getElementById("lightbox").classList.remove("active");
    }
  </script>
</body>
</html>
